{% if page_obj.has_other_pages %}
  <nav class="pagination" aria-label="Pagination">
    {% if page_obj.has_previous %}
      <a class="button secondary" href="?page={{ page_obj.previous_page_number }}">Previous</a>
    {% else %}
      <span class="button secondary pagination-disabled">Previous</span>
    {% endif %}
    <span class="pagination-status">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a class="button secondary" href="?page={{ page_obj.next_page_number }}">Next</a>
    {% else %}
      <span class="button secondary pagination-disabled">Next</span>
    {% endif %}
  </nav>
{% endif %}
