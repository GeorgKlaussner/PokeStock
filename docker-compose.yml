services:
  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      POSTGRES_DB: ${POSTGRES_DB:-pokestock}
      POSTGRES_USER: ${POSTGRES_USER:-pokestock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokestock}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      OCR_SERVICE_URL: http://ocr:8080
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng+deu+spa+jpn}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    command: >
      sh -c "python manage.py migrate &&
             python manage.py ensureadmin &&
             python manage.py collectstatic --noinput &&
             gunicorn pokestock_project.wsgi:application
             --bind 0.0.0.0:8000
             --worker-class gthread
             --workers ${WEB_CONCURRENCY:-2}
             --threads ${GUNICORN_THREADS:-4}
             --timeout ${GUNICORN_TIMEOUT:-60}
             --access-logfile -
             --error-logfile -
             --access-logformat '%(h)s %(r)s %(s)s %(M)sms'"
    ports:
      - "8000:8000"
    networks:
      - pokestock-egress
      - pokestock-internal
    volumes:
      - .:/app
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ocr:
        condition: service_started

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pokestock}
      POSTGRES_USER: ${POSTGRES_USER:-pokestock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokestock}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      OCR_SERVICE_URL: http://ocr:8080
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng+deu+spa+jpn}
    command: celery -A pokestock_project worker --loglevel=info --beat
    networks:
      - pokestock-egress
      - pokestock-internal
    volumes:
      - .:/app
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ocr:
        condition: service_started

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pokestock}
      POSTGRES_USER: ${POSTGRES_USER:-pokestock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokestock}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pokestock-internal
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    networks:
      - pokestock-internal
    volumes:
      - redis-data:/data

  ocr:
    build:
      context: .
      dockerfile: ocr_service/Dockerfile
    environment:
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng+deu+spa+jpn}
    networks:
      - pokestock-internal

volumes:
  postgres-data:
  redis-data:

networks:
  pokestock-egress:
  pokestock-internal:
    internal: true
